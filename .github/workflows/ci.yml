name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  PYTHON_VERSION: "3.12"
  IMAGE_NAME: project-management-service

jobs:
  validate:
    name: Validate Python Service
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate protobuf stubs
        run: |
          mkdir -p generated
          touch generated/__init__.py
          python -m grpc_tools.protoc \
            -I./proto \
            --python_out=./generated \
            --grpc_python_out=./generated \
            ./proto/user.proto \
            ./proto/project.proto

      - name: Compile check
        run: python -m compileall -q .

      - name: Run tests when present
        shell: bash
        run: |
          if compgen -G "test_*.py" > /dev/null || compgen -G "tests/**/*.py" > /dev/null; then
            pip install pytest
            pytest -q
          else
            echo "No test files found; skipping pytest."
          fi

  build_and_push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: ACR login
        run: az acr login --name "${{ vars.ACR_NAME }}"

      - name: Build image
        run: |
          IMAGE_URI="${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"
          docker build -t "$IMAGE_URI" .
          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"

      - name: Scan image with Trivy
        shell: bash
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:0.56.1 image \
            --ignore-unfixed \
            --vuln-type os,library \
            --severity HIGH,CRITICAL \
            --exit-code 1 \
            "${{ env.IMAGE_URI }}"

      - name: Push image
        run: docker push "${{ env.IMAGE_URI }}"
