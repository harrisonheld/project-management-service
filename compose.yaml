services:
  mongo:
    image: mongo:7
    container_name: pms-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  mock-auth:
    build:
      context: .
    container_name: pms-mock-auth
    restart: unless-stopped
    command: ["python", "mocks/mock_auth.py"]
    environment:
      USERAUTH_GRPC_PORT: "50051"
    ports:
      - "50051:50051"

  project-service:
    build:
      context: .
    container_name: pms-project-service
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
      mock-auth:
        condition: service_started
    environment:
      PROJECT_GRPC_PORT: "50053"
      USERAUTH_GRPC_ADDR: mock-auth:50051
      MONGO_URI: mongodb://mongo:27017
    ports:
      - "50053:50053"

volumes:
  mongo-data:

